# Dockhand stack for use BEHIND Pangolin: Pangolin does routing and TLS, so there is no Caddy.
# Sites live in a FILE on the VPS, so adding a site needs no redeploy: edit the file and the
# gateway and backends pick it up within seconds.
#
# 1. On the VPS create /srv/umbraco-mcp/sites.json (see sites.example.json), or set the stack
#    variable SITES_DIR to another folder. The FOLDER is mounted (not the file), so editors that
#    replace the file on save still work.
# 2. Deploy this stack. Only the gateway joins the external `shared` network.
# 3. In Pangolin: public resource on your Newt site, subdomain `*` (or one per site),
#    target http://umbraco-mcp-gateway:8787 over plain http, Pangolin authentication OFF
#    (Umbraco handles the login).
x-backend: &backend
  restart: unless-stopped
  environment:
    SITES_FILE: /config/sites.json
    TRUST_PROXY: "true"
    # UMBRACO_READONLY: "true"

services:
  gateway:
    image: ghcr.io/nul800sebastiaan/umbraco-mcp-editor-node-gateway:latest
    restart: unless-stopped
    environment:
      SITES_FILE: /config/sites.json
      TRUST_PROXY: "true"
    volumes:
      - ${SITES_DIR:-/srv/umbraco-mcp}:/config:ro
    networks:
      default:
      shared:
        aliases: [umbraco-mcp-gateway]
    depends_on: [mcp-v17, mcp-v18, mcp-v19]

  mcp-v17:
    <<: *backend
    image: ghcr.io/nul800sebastiaan/umbraco-mcp-editor-node:v17
    volumes:
      - mcp-v17-data:/data
      - ${SITES_DIR:-/srv/umbraco-mcp}:/config:ro

  mcp-v18:
    <<: *backend
    image: ghcr.io/nul800sebastiaan/umbraco-mcp-editor-node:v18
    volumes:
      - mcp-v18-data:/data
      - ${SITES_DIR:-/srv/umbraco-mcp}:/config:ro

  mcp-v19:
    <<: *backend
    image: ghcr.io/nul800sebastiaan/umbraco-mcp-editor-node:v19
    volumes:
      - mcp-v19-data:/data
      - ${SITES_DIR:-/srv/umbraco-mcp}:/config:ro

volumes:
  mcp-v17-data:
  mcp-v18-data:
  mcp-v19-data:

networks:
  shared:
    external: true
